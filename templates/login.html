{% extends "base.html" %}{% block content %}
<section class="auth-wrap"><div class="auth-card"><div class="auth-symbol">✦</div>
<h1>Welcome back</h1><p>Log in to continue your Gram Mitra workspace.</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="POST">
{% if signup %}<label>Full name<input name="name" required minlength="2" placeholder="Your name"></label>{% endif %}
<label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
<label>Password<input type="password" name="password" required minlength="6" placeholder="Minimum 6 characters"></label>
<button class="btn full" type="submit">Login</button>
</form>
<p class="auth-switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div></section>{% endblock %}
